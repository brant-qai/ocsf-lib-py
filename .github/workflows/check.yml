name: Check

on:
  - pull_request

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python and uv
        uses: ./.github/actions/uv

      - name: Check formatting
        run: |
          source $VENV
          uv run ruff check
          uv run ruff format --check

  type-checking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python and uv
        uses: ./.github/actions/uv

      - name: Type check
        run: |
          source $VENV
          uv run pyright --warnings

  testing:
    strategy:
      matrix:
        python-version:
          - "3.11.2"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python and uv
        uses: ./.github/actions/uv

      - name: Run tests
        run: |
          uv run pytest
